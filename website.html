<!DOCTYPE html>
<html>
    <head>
        <style>
            body
            {
                background-color: gray;
            }
            .container
            {
                background-color: rgb(78, 78, 78);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 950px;
                width: 200px;
            }
            .navbuttons
            {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .button1, .button2, .button3, .button4
            {
                height: 25px;
                width: 175px;
            }
            .boxes
            {
                display: flex;
                justify-content: center;
                gap: 100px;
            }
            .box2
            {
                background-color: yellow;
                display: flex;
                width: 200px;
                height: 200px;
                justify-content: center;
                align-items: center;
            }
            .box1
            {
                background-color: blue;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 200px;
                width: 200px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="navbuttons">
                <button class="button1">Home</button>
                <button class="button2">Profile</button>
                <button class="button2">Projects</button>
                <button class="button2">Contact Us</button>
            </div>
        </div>
        <div class="content">
            <div class="boxes">
                <div class="box1">BOX 1</div>
                <div class="box2">BOX 2</div>
            </div>
        </div>
    </body>
</html>
